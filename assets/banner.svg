<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d">
  <title id="t">Pranay Mishra — Digital Transformation, RevOps and AI Automation Consultant</title>
  <desc id="d">Pranay Mishra turns manual sales operations into systems that run themselves: Salesforce, HubSpot, AI agents. Based in Bangalore, working US and EU hours.</desc>
  <defs>
    <style>
      @font-face{font-family:B;src:url(data:font/woff2;base64,) format('woff2');font-weight:800}
      @font-face{font-family:G;src:url(data:font/woff2;base64,) format('woff2')}
      @font-face{font-family:M;src:url(data:font/woff2;base64,) format('woff2');font-weight:500}
      .b{font-family:B,'Helvetica Neue',sans-serif;font-weight:800}
      .g{font-family:G,'Helvetica Neue',sans-serif}
      .m{font-family:M,ui-monospace,Menlo,monospace;font-weight:500}
      .blob1{animation:d1 14s ease-in-out infinite alternate}
      .blob2{animation:d2 18s ease-in-out infinite alternate}
      @keyframes d1{from{transform:translate(0,0)}to{transform:translate(-140px,60px)}}
      @keyframes d2{from{transform:translate(0,0)}to{transform:translate(120px,-50px)}}
      .beam{stroke-dasharray:520;animation:draw 2.4s .4s cubic-bezier(.6,0,.2,1) both}
      @keyframes draw{from{stroke-dashoffset:520}to{stroke-dashoffset:0}}
      .rise{animation:rise .9s ease-out both}
      @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
      .pulse{animation:pulse 1.8s ease-out infinite;transform-origin:1076px 62px}
      @keyframes pulse{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(3.2)}}
      .flow{stroke-dasharray:4 10;animation:flow 1.2s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-28}}
    </style>
    <radialGradient id="a1"><stop offset="0" stop-color="#D97706" stop-opacity=".32"/><stop offset="1" stop-color="#D97706" stop-opacity="0"/></radialGradient>
    <radialGradient id="a2"><stop offset="0" stop-color="#92400E" stop-opacity=".4"/><stop offset="1" stop-color="#92400E" stop-opacity="0"/></radialGradient>
    <linearGradient id="bm" gradientUnits="userSpaceOnUse" x1="72" y1="0" x2="592" y2="0"><stop offset="0" stop-color="#D97706"/><stop offset=".7" stop-color="#F59E0B"/><stop offset="1" stop-color="#F59E0B" stop-opacity="0"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#FAF8F4" fill-opacity=".06"/></pattern>
    <clipPath id="card"><rect width="1200" height="420" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="420" fill="#09080C"/>
    <rect width="1200" height="420" fill="url(#dots)"/>
    <circle class="blob1" cx="980" cy="120" r="300" fill="url(#a1)"/>
    <circle class="blob2" cx="620" cy="420" r="260" fill="url(#a2)"/>

    <!-- availability pill -->
    <rect x="1050" y="44" width="110" height="36" rx="18" fill="#131009" stroke="#D97706" stroke-opacity=".45"/>
    <circle class="pulse" cx="1076" cy="62" r="5" fill="#F59E0B"/>
    <circle cx="1076" cy="62" r="5" fill="#F59E0B"/>
    <text class="m" x="1090" y="67" font-size="13" letter-spacing="1.5" fill="#FDE68A">OPEN</text>

    <!-- copy -->
    <text class="m rise" x="72" y="116" font-size="15" letter-spacing="3.5" fill="#D97706">DIGITAL TRANSFORMATION · REVOPS · AI AUTOMATION</text>
    <text class="b rise" x="68" y="214" font-size="96" letter-spacing="-3" fill="#FAF8F4" style="animation-delay:.15s">Pranay Mishra</text>
    <line class="beam" x1="72" y1="252" x2="592" y2="252" stroke="url(#bm)" stroke-width="3" stroke-linecap="round"/>
    <text class="g rise" x="72" y="292" font-size="25" fill="#C8BEB0" style="animation-delay:.35s">I turn manual sales operations into systems that run themselves.</text>

    <!-- chips -->
    <g class="m rise" font-size="13" letter-spacing="1.5" fill="#FAF8F4" text-anchor="middle" style="animation-delay:.55s">
      <rect x="72" y="332" width="124" height="36" rx="10" fill="#131009" stroke="#FAF8F4" stroke-opacity=".12"/><text x="134" y="355">SALESFORCE</text>
      <rect x="206" y="332" width="100" height="36" rx="10" fill="#131009" stroke="#FAF8F4" stroke-opacity=".12"/><text x="256" y="355">HUBSPOT</text>
      <rect x="316" y="332" width="116" height="36" rx="10" fill="#131009" stroke="#FAF8F4" stroke-opacity=".12"/><text x="374" y="355">AI AGENTS</text>
      <rect x="442" y="332" width="240" height="36" rx="10" fill="#131009" stroke="#D97706" stroke-opacity=".35"/><text x="562" y="355" fill="#FDE68A">BANGALORE · US/EU HOURS</text>
    </g>

    <!-- manual → system flow -->
    <g fill="none" stroke-width="1.5">
      <path id="p1" class="flow" d="M820 200 C 870 200, 880 120, 930 120" stroke="#D97706" stroke-opacity=".7"/>
      <path id="p2" class="flow" d="M930 120 C 980 120, 1000 200, 1050 200" stroke="#D97706" stroke-opacity=".7"/>
      <path id="p3" class="flow" d="M1050 200 C 1080 200, 1090 120, 1120 120" stroke="#F59E0B" stroke-opacity=".8"/>
    </g>
    <circle r="4" fill="#FDE68A"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
    <circle r="4" fill="#FDE68A"><animateMotion dur="2.4s" begin=".8s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
    <circle r="4" fill="#FDE68A"><animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
    <g class="m" font-size="11" letter-spacing="1.5" text-anchor="middle">
      <rect x="772" y="184" width="96" height="32" rx="8" fill="#131009" stroke="#FAF8F4" stroke-opacity=".15"/><text x="820" y="204" fill="#C8BEB0">LEADS</text>
      <rect x="886" y="104" width="88" height="32" rx="8" fill="#131009" stroke="#FAF8F4" stroke-opacity=".15"/><text x="930" y="124" fill="#C8BEB0">CRM</text>
      <rect x="1000" y="184" width="100" height="32" rx="8" fill="#131009" stroke="#D97706" stroke-opacity=".6"/><text x="1050" y="204" fill="#FDE68A">AI AGENT</text>
      <rect x="1072" y="104" width="96" height="32" rx="8" fill="#D97706"/><text x="1120" y="124" fill="#09080C">REVENUE</text>
    </g>

    <rect x=".5" y=".5" width="1199" height="419" rx="23.5" fill="none" stroke="#FAF8F4" stroke-opacity=".08"/>
  </g>
</svg>
